plugins {
    id 'fabric-loom' version '1.14.1'
    id 'maven-publish'
}

version = project.properties['mod_version'] ?: '1.0.0'
group = project.properties['maven_group'] ?: 'com.cloudvisuals'
base {
    archivesName = project.properties['archives_base_name'] ?: 'cloudvisuals'
}

loom {
    accessWidenerPath = file("src/main/resources/zero.accesswidener")
}

// ZeroVisuals отключал валидацию AW из-за нативных либ — сохраняем
tasks.named('validateAccessWidener') {
    enabled = false
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://libraries.minecraft.net/" }
    maven { url "https://jitpack.io" }
    maven { url "https://repo.clojars.org" }
    // SimpleVisuals -> Cloth Config
    maven { url "https://maven.shedaniel.me/" }
    // ModMenu
    maven { url "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Lombok — нужен ZeroVisuals-ядру
    compileOnly "org.projectlombok:lombok:1.18.42"
    annotationProcessor "org.projectlombok:lombok:1.18.42"

    // Cloth Config + ModMenu — нужны SimpleVisuals; fabric-api тянется отдельно
    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    // ZeroVisuals: JNA (медиа-клавиши) + LWJGL Vulkan/shaderc (render backend).
    // Motionsuite тоже использует LWJGL Vulkan — те же артефакты, дублей нет.
    implementation "net.java.dev.jna:jna:5.15.0"
    include "net.java.dev.jna:jna:5.15.0"
    implementation "org.lwjgl:lwjgl-vulkan:3.3.3"
    include "org.lwjgl:lwjgl-vulkan:3.3.3"
    implementation "org.lwjgl:lwjgl-shaderc:3.3.3"
    include "org.lwjgl:lwjgl-shaderc:3.3.3"
    runtimeOnly "org.lwjgl:lwjgl:3.3.3:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-shaderc:3.3.3:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-vulkan:3.3.3"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
    it.options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
